<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Night mountain landscape in purple">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0a14"/>
      <stop offset="0.45" stop-color="#1a1530"/>
      <stop offset="0.75" stop-color="#3b2a73"/>
      <stop offset="1" stop-color="#7c5ad6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.75">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#9d7cd8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9d7cd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mount" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3fa8"/>
      <stop offset="1" stop-color="#241a47"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e9ff"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bb9af7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="400" rx="10"/></clipPath>
    <style>
      .s { fill: #e6dcff; animation: tw 4s ease-in-out infinite; }
      .s2 { animation-delay: 1.3s; }
      .s3 { animation-delay: 2.6s; }
      @keyframes tw { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#sky)"/>
    <rect width="1200" height="400" fill="url(#glow)"/>

    <!-- estrelas -->
    <g>
      <circle class="s" cx="70" cy="48" r="1.3"/>
      <circle class="s s2" cx="158" cy="112" r="1"/>
      <circle class="s s3" cx="236" cy="36" r="1.5"/>
      <circle class="s" cx="318" cy="92" r="0.9"/>
      <circle class="s s2" cx="402" cy="52" r="1.2"/>
      <circle class="s s3" cx="468" cy="140" r="0.9"/>
      <circle class="s" cx="545" cy="28" r="1.1"/>
      <circle class="s s2" cx="612" cy="84" r="1.4"/>
      <circle class="s s3" cx="706" cy="40" r="1"/>
      <circle class="s" cx="778" cy="118" r="1.2"/>
      <circle class="s s2" cx="852" cy="30" r="0.9"/>
      <circle class="s s3" cx="930" cy="76" r="1.5"/>
      <circle class="s" cx="1008" cy="44" r="1"/>
      <circle class="s s2" cx="1082" cy="126" r="1.2"/>
      <circle class="s s3" cx="1150" cy="62" r="1.3"/>
      <circle class="s" cx="118" cy="170" r="0.8"/>
      <circle class="s s2" cx="1040" cy="178" r="0.8"/>
      <circle class="s s3" cx="372" cy="176" r="0.8"/>
    </g>

    <!-- lua crescente -->
    <g transform="translate(300 96)">
      <circle r="30" fill="#bb9af7" opacity="0.12"/>
      <path d="M 9 -17 A 19 19 0 1 0 9 17 A 14.5 14.5 0 1 1 9 -17 Z" fill="#f1e9ff"/>
    </g>

    <!-- serras ao fundo -->
    <path d="M0 292 L90 262 L170 280 L270 244 L360 276 L450 256 L540 282 L1200 300 L1200 400 L0 400 Z" fill="#3a2a70" opacity="0.7"/>

    <!-- montanha -->
    <path d="M330 330 C470 300 560 214 640 150 C656 138 668 132 684 132 L716 132 C732 132 744 138 760 150 C850 216 950 300 1110 330 Z" fill="url(#mount)"/>
    <!-- neve -->
    <path d="M640 150 C656 138 668 132 684 132 L716 132 C732 132 744 138 760 150 C778 163 796 178 814 192 L792 184 L776 204 L752 180 L734 208 L712 178 L694 210 L672 180 L652 204 L634 184 L596 186 C611 174 626 161 640 150 Z" fill="url(#snow)"/>

    <!-- neblina -->
    <rect x="0" y="262" width="1200" height="70" fill="url(#mist)"/>

    <!-- colinas -->
    <path d="M0 322 C140 292 260 312 400 322 C560 334 700 304 860 316 C1000 326 1100 304 1200 312 L1200 400 L0 400 Z" fill="#1f1740"/>
    <path d="M0 356 C180 328 340 362 520 350 C700 338 860 368 1020 352 C1100 344 1160 350 1200 354 L1200 400 L0 400 Z" fill="#141026"/>

    <!-- pinheiros -->
    <g fill="#0d0a1a">
      <path d="M0 400 L0 372 C200 356 420 384 620 374 C820 364 1020 388 1200 372 L1200 400 Z"/>
      <path d="M92 372 l9 -34 l9 34 z M118 374 l7 -26 l7 26 z M214 376 l10 -40 l10 40 z M246 378 l7 -24 l7 24 z M902 380 l9 -36 l9 36 z M930 382 l7 -26 l7 26 z M1046 378 l10 -42 l10 42 z M1078 378 l8 -28 l8 28 z M1120 376 l7 -24 l7 24 z"/>
    </g>
  </g>
</svg>
